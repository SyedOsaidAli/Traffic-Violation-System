<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic Violation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a1a2e, #16213e); }
        .navbar-brand { font-weight: 700; font-size: 1.3rem; color: #00d4ff !important; }
        .nav-link { color: #ccc !important; }
        .nav-link:hover, .nav-link.active { color: #00d4ff !important; }
        .stat-card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .sidebar { min-height: 100vh; background: linear-gradient(180deg, #1a1a2e, #16213e); padding-top: 20px; }
        .sidebar .nav-link { color: #aaa; padding: 12px 20px; border-radius: 8px; margin: 3px 10px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(0,212,255,0.15); color: #00d4ff !important; }
        .sidebar .nav-link i { width: 20px; }
        .main-content { padding: 30px; }
        .page-title { font-weight: 700; color: #1a1a2e; margin-bottom: 25px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .badge-pending { background-color: #ff4757; }
        .badge-paid { background-color: #2ed573; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); border: none; }
        .btn-primary:hover { background: linear-gradient(135deg, #0099cc, #007799); }
        table thead { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; }
        table thead th { border: none; padding: 15px; }
        tbody tr:hover { background-color: #f8f9ff; }
    </style>
</head>
<body>
<div class="d-flex">
    <!-- Sidebar -->
    <div class="sidebar" style="width: 250px; min-width: 250px;">
        <div class="text-center mb-4 px-3">
            <i class="fas fa-traffic-light fa-2x" style="color: #00d4ff;"></i>
            <div style="color: #00d4ff; font-weight: 700; margin-top: 8px;">Traffic Violation</div>
            <div style="color: #888; font-size: 0.8rem;">Management System</div>
        </div>
        <nav class="nav flex-column">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
            <a class="nav-link {% if '/vehicles' in request.path %}active{% endif %}" href="/vehicles"><i class="fas fa-car me-2"></i>Vehicles</a>
            <a class="nav-link {% if '/violations' in request.path %}active{% endif %}" href="/violations"><i class="fas fa-exclamation-triangle me-2"></i>Violations</a>
            <a class="nav-link {% if '/fines' in request.path %}active{% endif %}" href="/fines"><i class="fas fa-file-invoice-dollar me-2"></i>Fines</a>
            <a class="nav-link {% if '/search' in request.path %}active{% endif %}" href="/search"><i class="fas fa-search me-2"></i>Search</a>
            <a class="nav-link {% if '/logs' in request.path %}active{% endif %}" href="/logs"><i class="fas fa-history me-2"></i>Trigger Logs</a>
        </nav>
    </div>

    <!-- Main -->
    <div class="flex-grow-1">
        <nav class="navbar navbar-expand-lg px-4 py-3">
            <span class="navbar-brand"><i class="fas fa-shield-alt me-2"></i>Traffic Violation System</span>
            <div class="ms-auto" style="color: #aaa; font-size: 0.9rem;">
                <i class="fas fa-circle text-success me-1" style="font-size:0.6rem;"></i>System Online
            </div>
        </nav>
        <div class="main-content">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
